org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Mod
version=0.1.1+26.1.2
group=ml.mypals.exit
mod_id=emergency_exit
mod_name=EXIT
mod_author=Ryan100C
license=CC0-1.0
description=A library that lets custom world rendering bypass shader packs (Iris). Drawings go to a separate render target and are merged by depth after the shader pack has finished the frame.
java_version=25

# Minecraft
minecraft_version=26.1.2
minecraft_version_range=[26.1.2, 26.2)
neo_form_version=26.1.2-1

# Fabric, see https://fabricmc.net/develop
fabric_loader_version=0.19.5
fabric_api_version=0.155.3+26.1.2

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.1.2.122
neoforge_loader_version_range=[4,)

# Iris and Sodium on Modrinth, project:version. Compiled against and loaded in the development runs only.
iris_fabric=YL57xq9U:sZbVsl2Q
sodium_fabric=AANobbMI:tZQ3jqnf
iris_neoforge=YL57xq9U:qE5Y7GrZ
sodium_neoforge=AANobbMI:zg4YQ9EL
# Libraries Iris nests in its jar, which the development runs do not load from there
glsl_transformer_version=3.0.0-pre3
# Super Resolution, only in the Fabric development runs with -Pexit.superResolution
super_resolution_fabric=Hf3Qz2H3:nqjPyF6Q
