org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Mod
version=0.1.0+1.17.1
group=ml.mypals.exit
mod_id=emergency_exit
mod_name=EXIT
mod_author=Ryan100C
license=CC0-1.0
description=A library that lets custom world rendering bypass shader packs (Iris). Drawings go to a separate render target and are merged by depth after the shader pack has finished the frame.
# Minecraft 1.17 runs on Java 16. The sources compile at that level (the build itself runs on a newer JDK).
java_version=16

# Minecraft
minecraft_version=1.17.1
minecraft_version_range=>=1.17 <=1.17.1

# Fabric, see https://fabricmc.net/develop
fabric_loader_version=0.19.5
fabric_api_version=0.46.1+1.17

# Iris and Sodium on Modrinth, project:version. Compiled against and loaded in the development runs only.
# Iris for 1.17.1 is 1.2.x, in net.coderbot.iris; Iris has no NeoForge build for this Minecraft version, so this
# branch is Fabric-only.
iris_fabric=YL57xq9U:pkGrlTNQ
sodium_fabric=AANobbMI:Fz37KqRh
