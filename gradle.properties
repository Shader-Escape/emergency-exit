org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Mod
version=0.1.4+1.20
group=ml.mypals.exit
mod_id=emergency_exit
mod_name=EXIT
mod_author=Ryan100C
license=CC0-1.0
description=A library that lets custom world rendering bypass shader packs (Iris). Drawings go to a separate render target and are merged by depth after the shader pack has finished the frame.
java_version=17

# Minecraft
minecraft_version=1.20
# 1.20.1 and older have no NeoForm build for ModDevGradle, so there is no `common` subproject (see settings.gradle):
# this branch is a single Fabric Loom project, like LitematicaPass. The code is the same as 1.20.2's (Iris for both is
# still in net.coderbot), so the mod also accepts 1.19.4, which LitematicaPass checked with this code.
minecraft_version_range=>=1.19.4 <=1.20

# Fabric, see https://fabricmc.net/develop
fabric_loader_version=0.19.5
fabric_api_version=0.83.0+1.20

# Iris and Sodium on Modrinth, project:version. Compiled against and loaded in the development runs only.
# Iris has no NeoForge build for this Minecraft version, so this branch is Fabric-only.
iris_fabric=YL57xq9U:URWeWMAt
sodium_fabric=AANobbMI:vgceLbdH
