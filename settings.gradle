pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'emergency-exit'
// Minecraft 1.20.1 and older have no NeoForm build for ModDevGradle, so there is no `common` subproject: the whole mod
// lives in `fabric`, which Loom remaps from Mojang names, like LitematicaPass.
include('fabric')
