plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// Development mod that creates a world and checks the rendering. Run it with runSmokeClient.
sourceSets.create('smoke') {
    java.srcDirs = [project(':common').file('src/smoke/java'), file('src/smoke/java')]
    resources.srcDirs = [project(':common').file('src/smoke/resources'), file('src/smoke/resources')]
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
}

def smokeProps = ['mixin_java': "JAVA_${java_version}".toString(), 'neoforge_loader_version_range': neoforge_loader_version_range]
tasks.named('processSmokeResources', ProcessResources) {
    inputs.properties(smokeProps)
    filesMatching(['*.mixins.json', 'META-INF/neoforge.mods.toml']) {
        expand(smokeProps)
    }
}

neoForge {
    version = neoforge_version
    mods {
        emergency_exit {
            sourceSet sourceSets.main
        }
        emergency_exit_smoke {
            sourceSet sourceSets.smoke
        }
    }
    runs {
        client {
            client()
            gameDirectory = rootProject.file("run/neoforge-${minecraft_version}")
        }
        smokeClient {
            client()
            gameDirectory = rootProject.file("run/neoforge-${minecraft_version}")
            loadedMods = [mods.emergency_exit, mods.emergency_exit_smoke]
            // Headless, so startup errors end the run instead of opening a dialog. The game window still opens.
            jvmArgument('-Djava.awt.headless=true')
        }
    }
}

dependencies {
    // Compiled against and loaded in the development runs, but not a dependency of the published library.
    for (mod in [iris_neoforge, sodium_neoforge]) {
        compileOnly("maven.modrinth:${mod}")
        runtimeOnly("maven.modrinth:${mod}")
    }
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
