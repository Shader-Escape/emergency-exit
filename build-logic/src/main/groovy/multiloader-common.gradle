plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

def licenseName = "LICENSE_${mod_name}"
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { licenseName }
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.findProperty('description'),
            'neoforge_version'             : project.findProperty('neoforge_version') ?: '',
            'neoforge_loader_version_range': project.findProperty('neoforge_loader_version_range') ?: '',
            'java_version'                 : java_version,
            'mixin_java'                   : "JAVA_${java_version}"
    ]

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            // JitPack serves the jars as com.github.<user>.<repo>:<artifactId>:<tag or branch-SNAPSHOT>, and Gradle rejects
            // a POM or module file that names other coordinates. Only the publication changes: the mod keeps its version.
            if (System.getenv('JITPACK')) {
                groupId = "${System.getenv('GROUP')}.${System.getenv('ARTIFACT')}"
                version = System.getenv('VERSION')
            }
            from components.java
        }
    }
}
