plugins {
    id 'java-library'
    id 'maven-publish'
    // Minecraft 1.20 is obfuscated: the mod is compiled against Mojang's names and remapped to intermediary.
    id 'net.fabricmc.fabric-loom-remap'
}

base {
    archivesName = "${mod_id}-fabric"
}

// Minecraft 1.20.1 and older have no NeoForm build for ModDevGradle, so there is no `common` subproject: everything,
// including the loader-independent code, lives here.
repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = uri('https://api.modrinth.com/maven')
            }
        }
        filter {
            includeGroup('maven.modrinth')
        }
    }
}

// The libraries nested in the Iris and Sodium jars (their Fabric API modules aside), for the development runtime.
def nestingJars = configurations.detachedConfiguration(
    dependencies.create("maven.modrinth:${iris_fabric}"),
    dependencies.create("maven.modrinth:${sodium_fabric}")
)
nestingJars.transitive = false
def nestedLibraries = tasks.register('nestedLibraries', Sync) {
    from({ nestingJars.files.collect { zipTree(it) } }) {
        include 'META-INF/jars/*.jar'
        exclude 'META-INF/jars/fabric-*'
        // Older Iris nests slf4j as a generated mod, which on the classpath hides every mod from Fabric Loader.
        exclude 'META-INF/jars/slf4j-*'
        eachFile { path = name }
    }
    includeEmptyDirs = false
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    into layout.buildDirectory.dir('nestedLibraries')
}

dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    mappings(loom.officialMojangMappings())
    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

    // Compiled against and loaded in the development runs, but not a dependency of the published library.
    for (mod in [iris_fabric, sodium_fabric]) {
        modCompileOnly("maven.modrinth:${mod}")
        modLocalRuntime("maven.modrinth:${mod}")
    }
    // Iris and Sodium nest libraries (jcpp, ANTLR, glsl-transformer, JOML before 1.19.3; versions differ per build) in
    // their jars, but the development runtime does not load the nested jars of dependencies; without them Iris fails as
    // soon as it reads a shader pack. Put the copies from those jars themselves on the runtime classpath.
    localRuntime(fileTree(nestedLibraries.map { it.destinationDir }) { include '*.jar' }.builtBy(nestedLibraries))
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

// Development mod that checks every mixin applies. Run it with runAuditClient.
sourceSets.create('audit') {
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
}

// Development mod that creates a world and checks the rendering. Run it with runSmokeClient.
sourceSets.create('smoke') {
    compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
}

def expandProps = [
        'version'                 : version,
        'minecraft_version_range' : minecraft_version_range,
        'fabric_loader_version'   : fabric_loader_version,
        'mod_name'                : mod_name,
        'mod_author'              : mod_author,
        'mod_id'                  : mod_id,
        'license'                 : license,
        'description'             : project.findProperty('description'),
        'java_version'            : java_version,
        'mixin_java'              : "JAVA_${java_version}"
]

processResources {
    inputs.properties(expandProps)
    filesMatching(['fabric.mod.json', '*.mixins.json']) {
        expand(expandProps)
    }
}

def smokeProps = ['mixin_java': "JAVA_${java_version}".toString()]
tasks.named('processSmokeResources', ProcessResources) {
    inputs.properties(smokeProps)
    filesMatching('*.mixins.json') {
        expand(smokeProps)
    }
}

def licenseName = "LICENSE_${mod_name}"
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { licenseName }
    }
}

loom {
    mods {
        register(mod_id) { sourceSet(sourceSets.main) }
        register('emergency_exit_audit') { sourceSet(sourceSets.audit) }
        register('emergency_exit_smoke') { sourceSet(sourceSets.smoke) }
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
        }
        auditClient {
            client()
            source(sourceSets.audit)
            // Headless, so startup errors end the run instead of opening a dialog.
            vmArg('-Djava.awt.headless=true')
        }
        smokeClient {
            client()
            source(sourceSets.smoke)
            // Headless, so startup errors end the run instead of opening a dialog. The game window still opens.
            vmArg('-Djava.awt.headless=true')
        }
        remove server
    }
    runConfigs.configureEach {
        ideConfigGenerated(true)
        // Exports transformed classes, which the audit reads.
        vmArg('-Dmixin.debug.export=true')
        runDir("../run/fabric-${minecraft_version}")
    }
}

// The audit reads the classes Mixin exports, so drop the ones from earlier runs.
tasks.named('runAuditClient') {
    def exported = rootProject.file("run/fabric-${minecraft_version}/.mixin.out")
    doFirst { exported.deleteDir() }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            // JitPack serves the jars as com.github.<user>.<repo>:<artifactId>:<tag or branch-SNAPSHOT>, and Gradle rejects
            // a POM or module file that names other coordinates. Only the publication changes: the mod keeps its version.
            if (System.getenv('JITPACK')) {
                groupId = "${System.getenv('GROUP')}.${System.getenv('ARTIFACT')}"
                version = System.getenv('VERSION')
            }
            from components.java
        }
    }
}
